[tool.uv.workspace]
members = ["packages/*"]

[project]
name = "swg"
version = "0.1.0"
description = "My uv workspace root"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["packages/agent/src", "packages/ui/src"]
extend-exclude = [".venv", ".venv-py315-blocked"]

[tool.ruff.lint]
# ANN requires type hints on every function signature.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "PT", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"scripts/**" = ["ANN"]

[tool.pyright]
pythonVersion = "3.13"
include = ["packages"]
exclude = ["**/.venv", "**/__pycache__"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages/agent/tests", "packages/ui/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
