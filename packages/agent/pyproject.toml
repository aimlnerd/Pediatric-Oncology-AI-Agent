[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "BSPHO Pediatric Oncology ADK Agent & Vertex AI Search RAG"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.13.0",
    "google-cloud-discoveryengine>=0.13.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent-runner = "agent.runner:main"
